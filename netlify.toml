# Netlify-oppsett for Vagus Entero AS.
#
# Miljøvariabler settes i Netlify-dashbordet, aldri her:
# - PREVIEW_BRUKER / PREVIEW_PASSORD (valgfritt, besluttet 24.08.2026): settes
#   de, får alle ikke-produksjonsbygg Basic-Auth automatisk. Uten dem bygges
#   previews åpne — men alltid noindexet. Anbefales PÅ når pasienttekst i
#   UTKAST begynner å flyte inn.
# - PRODUKSJON=1 + SITE_URL: KUN production-konteksten, settes manuelt på
#   lanseringsdagen (krever manuelt trigget deploy etterpå). Se docs/LANSERING.md.
#
# Headere (CSP, noindex, Basic-Auth) settes IKKE her — de genereres av bygget
# til _headers fra sikkerhet/policy.json + miljøet, fordi netlify.toml-headere
# ikke kan variere per deploy-kontekst.

[build]
  command = "npm run bygg"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Samme som i CI: avhengigheter installeres uten installasjonsskript.
  NPM_FLAGS = "--ignore-scripts"
  # Forhåndsvisningspassordet skrives med vilje til _headers (Basic-Auth).
  # Netlifys hemmelighetsskann ville ellers stoppe bygget når verdien
  # dukker opp i publiseringskatalogen.
  SECRETS_SCAN_OMIT_KEYS = "PREVIEW_PASSORD,PREVIEW_BRUKER"
